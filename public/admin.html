<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event booking — admin</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e2e2e5;
    --text: #1a1a1e;
    --muted: #6b6b73;
    --accent: #1f6feb;
    --danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316;
      --card: #1c1c20;
      --border: #2c2c31;
      --text: #f0f0f2;
      --muted: #9a9aa2;
      --accent: #5b9dff;
      --danger: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px 16px 60px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
  input, textarea { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 0.9rem; margin-bottom: 12px; }
  button { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 8px 16px; font-size: 0.85rem; cursor: pointer; }
  button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
  button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .slot-entry { margin-bottom: 10px; }
  .slot-row { display: grid; grid-template-columns: 1fr 100px 80px 32px; gap: 8px; align-items: center; }
  .slot-row input { margin-bottom: 0; }
  .slot-preview { color: var(--muted); font-size: 0.78rem; margin: 4px 0 0; }
  .event { border-bottom: 1px solid var(--border); padding: 12px 0; }
  .event:last-child { border-bottom: none; }
  .event h3 { margin: 0 0 4px; font-size: 1rem; }
  .event .meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 8px; }
  .slot-list { font-size: 0.85rem; }
  .slot-list div { display: flex; justify-content: space-between; padding: 3px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  #gate { max-width: 320px; margin: 80px auto; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .error { color: var(--danger); font-size: 0.85rem; margin: 8px 0; }
  select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); margin-bottom: 12px; }
</style>
</head>
<body>
  <div id="gate" class="card">
    <h1>Log ind</h1>
    <p class="sub">Adgangskode til event-administration</p>
    <input type="password" id="secret" placeholder="Adgangskode">
    <button onclick="login()">Log ind</button>
    <p class="error" id="gate-error" hidden></p>
  </div>

  <div id="app" class="wrap" hidden>
    <h1>Event booking</h1>
    <p class="sub">Opret og redigér events + tider. Ændringer er live med det samme.</p>

    <div class="card">
      <h2 id="form-title">Nyt event</h2>
      <label>Event-ID <span style="font-weight:400;color:var(--muted)">(bruges i temaeditoren, må ikke ændres bagefter)</span></label>
      <input id="event_id" placeholder="fx run-event-2026">
      <label>Titel</label>
      <input id="title" placeholder="fx Løbeevent september 2026">
      <label>Maks. antal ekstra personer pr. tilmelding <span style="font-weight:400;color:var(--muted)">(0 = kan kun tilmelde sig selv)</span></label>
      <input id="max_guests" type="number" min="0" value="0">
      <label>Tider</label>
      <div id="slots"></div>
      <button type="button" class="secondary" onclick="addSlotRow()">+ Tilføj tidspunkt</button>
      <div class="row">
        <button onclick="saveEvent()">Gem event</button>
        <button type="button" class="secondary" onclick="resetForm()">Ryd formular</button>
      </div>
      <p class="error" id="form-error" hidden></p>
    </div>

    <div class="card">
      <h2>Eksisterende events</h2>
      <div id="events-list">Henter …</div>
    </div>

    <div class="card">
      <h2>Tilmeldinger</h2>
      <label>Filtrér på event</label>
      <select id="bookings-filter" onchange="loadBookings()"><option value="">Alle events</option></select>
      <div id="bookings-list">Henter …</div>
    </div>
  </div>

<script>
  let secret = sessionStorage.getItem('admin_secret') || '';

  function api(path, opts = {}) {
    return fetch(path, { ...opts, headers: { ...(opts.headers || {}), 'x-admin-secret': secret, 'Content-Type': 'application/json' } })
      .then(async (res) => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || 'Der opstod en fejl.');
        return data;
      });
  }

  function login() {
    secret = document.getElementById('secret').value;
    api('/api/admin/events').then(() => {
      sessionStorage.setItem('admin_secret', secret);
      document.getElementById('gate').hidden = true;
      document.getElementById('app').hidden = false;
      loadEvents();
      loadBookings();
    }).catch(() => {
      document.getElementById('gate-error').textContent = 'Forkert adgangskode.';
      document.getElementById('gate-error').hidden = false;
    });
  }

  const MONTHS_DA = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

  function formatSlotLabel(dateStr, timeStr) {
    if (!dateStr || !timeStr) return '';
    const [y, m, d] = dateStr.split('-').map(Number);
    return `${d}. ${MONTHS_DA[m - 1]} kl. ${timeStr}`;
  }

  // Existing slots were created with slot_id "YYYY-MM-DD-HHMM" (see
  // scripts/sync-event.js), so editing an event can populate the date/time
  // pickers straight from the stored id instead of losing that data.
  function parseSlotId(slotId) {
    const match = /^(\d{4}-\d{2}-\d{2})-(\d{2})(\d{2})$/.exec(slotId || '');
    if (!match) return null;
    return { date: match[1], time: `${match[2]}:${match[3]}` };
  }

  function addSlotRow(slot) {
    const wrap = document.getElementById('slots');
    const parsed = slot ? parseSlotId(slot.slot_id) : null;
    const entry = document.createElement('div');
    entry.className = 'slot-entry';
    entry.innerHTML = `
      <div class="slot-row">
        <input type="date" class="slot-date" value="${parsed?.date || ''}">
        <input type="time" class="slot-time" value="${parsed?.time || ''}">
        <input placeholder="Pladser" type="number" min="1" class="slot-capacity" value="${slot?.capacity || 25}">
        <button type="button" class="secondary" onclick="this.closest('.slot-entry').remove()">×</button>
      </div>
      <p class="slot-preview" data-preview>${slot?.label ? 'Gemt som: ' + slot.label : 'Vælg dato og tid'}</p>
    `;
    const dateInput = entry.querySelector('.slot-date');
    const timeInput = entry.querySelector('.slot-time');
    const preview = entry.querySelector('[data-preview]');
    const updatePreview = () => {
      const label = formatSlotLabel(dateInput.value, timeInput.value);
      preview.textContent = label ? 'Vises som: ' + label : 'Vælg dato og tid';
    };
    dateInput.addEventListener('input', updatePreview);
    timeInput.addEventListener('input', updatePreview);
    wrap.appendChild(entry);
  }

  function resetForm() {
    document.getElementById('form-title').textContent = 'Nyt event';
    document.getElementById('event_id').value = '';
    document.getElementById('event_id').disabled = false;
    document.getElementById('title').value = '';
    document.getElementById('max_guests').value = 0;
    document.getElementById('slots').innerHTML = '';
    addSlotRow();
  }

  function editEvent(ev) {
    document.getElementById('form-title').textContent = 'Redigér: ' + ev.title + ' (Event-nr. ' + ev.event_number + ')';
    document.getElementById('event_id').value = ev.event_id;
    document.getElementById('event_id').disabled = true;
    document.getElementById('title').value = ev.title;
    document.getElementById('max_guests').value = ev.max_guests;
    document.getElementById('slots').innerHTML = '';
    ev.slots.forEach(addSlotRow);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function saveEvent() {
    const error = document.getElementById('form-error');
    error.hidden = true;
    const event_id = document.getElementById('event_id').value.trim();
    const title = document.getElementById('title').value.trim();
    const max_guests = Number(document.getElementById('max_guests').value) || 0;

    const entries = Array.from(document.querySelectorAll('.slot-entry'));
    for (const entry of entries) {
      if (!entry.querySelector('.slot-date').value || !entry.querySelector('.slot-time').value) {
        error.textContent = 'Vælg både dato og tid for hvert tidspunkt.';
        error.hidden = false;
        return;
      }
    }

    const slots = entries.map((entry) => {
      const date = entry.querySelector('.slot-date').value;
      const time = entry.querySelector('.slot-time').value;
      return {
        slot_id: `${date}-${time.replace(':', '')}`,
        label: formatSlotLabel(date, time),
        capacity: Number(entry.querySelector('.slot-capacity').value),
      };
    });

    api('/api/admin/events', { method: 'POST', body: JSON.stringify({ event_id, title, max_guests, slots }) })
      .then(() => { resetForm(); loadEvents(); loadBookings(); })
      .catch((err) => { error.textContent = err.message; error.hidden = false; });
  }

  function deleteEvent(eventId) {
    if (!confirm('Slet eventet "' + eventId + '" og dets tider? Tilmeldinger bevares i oversigten.')) return;
    api('/api/admin/events', { method: 'DELETE', body: JSON.stringify({ event_id: eventId }) })
      .then(() => { loadEvents(); loadBookings(); });
  }

  function loadEvents() {
    api('/api/admin/events').then(({ events }) => {
      const list = document.getElementById('events-list');
      const filter = document.getElementById('bookings-filter');
      filter.innerHTML = '<option value="">Alle events</option>' + events.map(e => `<option value="${e.event_id}">${e.title}</option>`).join('');

      if (!events.length) { list.textContent = 'Ingen events oprettet endnu.'; return; }
      list.innerHTML = events.map(e => `
        <div class="event">
          <h3>${e.title} <span style="color:var(--muted);font-weight:400">#${e.event_number}</span></h3>
          <div class="meta">Event-ID: <code>${e.event_id}</code> · Maks. ekstra personer: ${e.max_guests}</div>
          <div class="slot-list">
            ${e.slots.map(s => `<div><span>${s.label}</span><span>${s.booked}/${s.capacity} booket</span></div>`).join('') || '<div>Ingen tider</div>'}
          </div>
          <div class="row">
            <button type="button" class="secondary" onclick='editEvent(${JSON.stringify(e).replace(/'/g, "&apos;")})'>Redigér</button>
            <button type="button" class="danger" onclick="deleteEvent('${e.event_id}')">Slet</button>
          </div>
        </div>
      `).join('');
    });
  }

  function loadBookings() {
    const eventId = document.getElementById('bookings-filter').value;
    api('/api/admin/bookings' + (eventId ? '?event_id=' + encodeURIComponent(eventId) : '')).then(({ bookings }) => {
      const list = document.getElementById('bookings-list');
      if (!bookings.length) { list.textContent = 'Ingen tilmeldinger endnu.'; return; }
      list.innerHTML = `
        <table>
          <thead><tr><th>Navn</th><th>Email</th><th>Telefon</th><th>Event</th><th>Tidspunkt</th><th>Personer</th><th>Noter</th><th>Tilmeldt</th></tr></thead>
          <tbody>
            ${bookings.map(b => {
              const guests = b.additional_names ? JSON.parse(b.additional_names) : [];
              const people = b.party_size > 1 ? `${b.party_size} (${b.name} + ${guests.join(', ')})` : '1';
              return `
              <tr>
                <td>${b.name}</td>
                <td>${b.email}</td>
                <td>${b.phone}</td>
                <td>${b.event_title} #${b.event_number}</td>
                <td>${b.slot_label || b.slot_id}</td>
                <td>${people}</td>
                <td>${b.notes || ''}</td>
                <td>${new Date(b.created_at).toLocaleString('da-DK')}</td>
              </tr>
            `;
            }).join('')}
          </tbody>
        </table>
      `;
    });
  }

  addSlotRow();
  if (secret) {
    api('/api/admin/events').then(() => {
      document.getElementById('gate').hidden = true;
      document.getElementById('app').hidden = false;
      loadEvents();
      loadBookings();
    }).catch(() => { sessionStorage.removeItem('admin_secret'); });
  }
</script>
</body>
</html>
